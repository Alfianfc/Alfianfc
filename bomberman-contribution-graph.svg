<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="0x357 contribution battle">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="0.55" stop-color="#e2e8f0"/><stop offset="1" stop-color="#f1f5f9"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="attackGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .sub { font: 600 11px 'Fira Code', 'Segoe UI', monospace; fill: #475569; letter-spacing: .9px; }
      .hp { font: 800 10px 'Fira Code', monospace; }
      .player { filter: url(#glow); }
      .enemy { filter: url(#glow); }
      .attack { filter: url(#attackGlow); }
    </style>
  </defs>
  <rect width="900" height="260" rx="22" fill="url(#bg)"/>
  <rect x="18" y="18" width="864" height="224" rx="18" fill="none" stroke="#f1f5f9" stroke-width="1.5" opacity="0.9"/>
  
  <!-- Arena floor grid -->
  <g opacity="0.3">
    <line x1="100" y1="200" x2="800" y2="200" stroke="#3b82f6" stroke-width="1"/>
    <line x1="150" y1="210" x2="750" y2="210" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="200" y1="220" x2="700" y2="220" stroke="#3b82f6" stroke-width="0.3"/>
  </g>
  
  <!-- Player HP Bar (left) -->
  <rect x="42" y="30" width="200" height="16" rx="8" fill="#f1f5f9" stroke="#3b82f6" stroke-width="1"/>
  <rect x="44" y="32" width="180" height="12" rx="6" fill="#3b82f6">
    <animate attributeName="width" values="180;160;180" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="50" y="42" class="hp" fill="#f8fafc">BOMBERMAN</text>
  <text x="210" y="42" class="hp" fill="#3b82f6">HP 92%</text>
  
  <!-- Enemy HP Bar (right) - decreasing -->
  <rect x="658" y="30" width="200" height="16" rx="8" fill="#f1f5f9" stroke="#ef4444" stroke-width="1"/>
  <rect x="660" y="32" width="120" height="12" rx="6" fill="#ef4444">
    <animate attributeName="width" values="120;80;40;80;120" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="666" y="42" class="hp" fill="#f8fafc">ENEMY</text>
  <text x="820" y="42" class="hp" fill="#ef4444">HP 35%</text>
  
  <!-- VS text -->
  <text x="450" y="45" text-anchor="middle" font-family="monospace" font-size="20" font-weight="800" fill="#f59e0b" opacity="0.8">VS</text>
  
  <!-- Player Bomberman (left side, attacking) -->
  <g class="player" transform="translate(200 130)">
    <!-- Body -->
    <circle cx="0" cy="0" r="22" fill="#ef4444"/>
    <!-- Head -->
    <circle cx="0" cy="-4" r="16" fill="#fbbf24"/>
    <!-- Eyes -->
    <circle cx="-5" cy="-10" r="3" fill="#e2e8f0"/>
    <circle cx="5" cy="-10" r="3" fill="#e2e8f0"/>
    <!-- Smile -->
    <path d="M-5 0 Q0 6 5 0" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Attack pose - arm extended -->
    <line x1="18" y1="0" x2="35" y2="-10" stroke="#fbbf24" stroke-width="4" stroke-linecap="round">
      <animate attributeName="x2" values="35;45;35" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="-10;-20;-10" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <!-- Bomb in hand -->
    <circle cx="40" cy="-15" r="8" fill="#f1f5f9" stroke="#f59e0b" stroke-width="2">
      <animate attributeName="r" values="8;10;8" dur="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="-25" r="2" fill="#ef4444">
      <animate attributeName="opacity" values="1;0;1" dur="0.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Walking animation -->
    <animateTransform attributeName="transform" type="translate" values="200 130;210 130;200 130" dur="0.8s" repeatCount="indefinite"/>
  </g>
  
  <!-- Attack projectile -->
  <g class="attack">
    <circle cx="280" cy="120" r="6" fill="#f59e0b" opacity="0.9">
      <animate attributeName="cx" values="280;500;700" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="6;8;4" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.6;0" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Trail -->
    <circle cx="260" cy="120" r="3" fill="#f59e0b" opacity="0.5">
      <animate attributeName="cx" values="260;480;680" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.3;0" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="120" r="2" fill="#f59e0b" opacity="0.3">
      <animate attributeName="cx" values="240;460;660" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Explosion on enemy -->
  <g class="attack">
    <circle cx="700" cy="130" r="0" fill="none" stroke="#ef4444" stroke-width="3" opacity="0">
      <animate attributeName="r" values="0;30;0" dur="1.5s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="1.5s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <!-- Damage sparks -->
    <circle cx="690" cy="110" r="2" fill="#fbbf24" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="710" cy="115" r="2" fill="#fbbf24" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="1.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="695" cy="140" r="2" fill="#fbbf24" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Enemy (right side, getting hit) -->
  <g class="enemy" transform="translate(700 130)">
    <!-- Body -->
    <circle cx="0" cy="0" r="20" fill="#7c3aed"/>
    <!-- Head -->
    <circle cx="0" cy="-3" r="14" fill="#8b5cf6"/>
    <!-- Eyes (angry/damage) -->
    <circle cx="-4" cy="-8" r="2.5" fill="#e2e8f0"/>
    <circle cx="4" cy="-8" r="2.5" fill="#e2e8f0"/>
    <!-- Damage expression -->
    <path d="M-4 2 L4 2" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Damage shake -->
    <animateTransform attributeName="transform" type="translate" values="700 130;695 130;705 130;700 130" dur="0.3s" repeatCount="indefinite"/>
  </g>
  
  <!-- Enemy HP bar damage effect -->
  <rect x="660" y="32" width="0" height="12" rx="6" fill="#fbbf24" opacity="0.6">
    <animate attributeName="width" values="0;40;0" dur="1.5s" begin="0.8s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Combo counter -->
  <text x="450" y="80" text-anchor="middle" font-family="monospace" font-size="16" font-weight="800" fill="#f59e0b" opacity="0">
    COMBO x3!
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
  </text>
  
  <!-- Hit effect text -->
  <text x="700" y="100" text-anchor="middle" font-family="monospace" font-size="14" font-weight="800" fill="#ef4444" opacity="0">
    -25
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="100;80;60" dur="1.5s" begin="0.8s" repeatCount="indefinite"/>
  </text>
  
  <!-- Victory sparkles -->
  <g>
    <circle cx="200" cy="80" r="2" fill="#fbbf24" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="90" r="1.5" fill="#3b82f6" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="85" r="1.5" fill="#f59e0b" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Bottom status -->
  <text x="42" y="226" class="sub">status: dominating the arena • combo: 3x • enemy hp: critical</text>
</svg>